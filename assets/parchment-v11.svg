<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="none">
  <defs>
    <radialGradient id="paper" cx="48%" cy="40%" r="78%">
      <stop offset="0" stop-color="#f2dfb5"/>
      <stop offset="0.58" stop-color="#e7ca91"/>
      <stop offset="0.88" stop-color="#d7b171"/>
      <stop offset="1" stop-color="#bd8f50"/>
    </radialGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8df" stop-opacity=".24"/>
      <stop offset=".32" stop-color="#fff4d3" stop-opacity=".05"/>
      <stop offset=".7" stop-color="#8b5b2d" stop-opacity=".04"/>
      <stop offset="1" stop-color="#6f421e" stop-opacity=".12"/>
    </linearGradient>
    <filter id="edge" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency=".011 .018" numOctaves="3" seed="22" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="fiber" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".65 .035" numOctaves="3" seed="41" result="fibers"/>
      <feColorMatrix in="fibers" type="matrix" values=".18 0 0 0 .55  0 .13 0 0 .42  0 0 .08 0 .24  0 0 0 .14 0" result="fiberTint"/>
      <feBlend in="SourceGraphic" in2="fiberTint" mode="multiply"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <g filter="url(#edge)">
    <rect x="12" y="12" width="1176" height="976" rx="18" fill="url(#paper)"/>
    <rect x="12" y="12" width="1176" height="976" rx="18" fill="url(#wash)"/>
    <g opacity=".12" filter="url(#soft)" fill="#79502a">
      <ellipse cx="116" cy="148" rx="62" ry="46"/>
      <ellipse cx="1040" cy="196" rx="52" ry="39"/>
      <ellipse cx="214" cy="847" rx="67" ry="45"/>
      <ellipse cx="1014" cy="822" rx="75" ry="53"/>
    </g>
    <g opacity=".09" fill="#6d4420">
      <circle cx="155" cy="103" r="6"/><circle cx="197" cy="143" r="4"/><circle cx="972" cy="114" r="5"/>
      <circle cx="1102" cy="714" r="5"/><circle cx="121" cy="754" r="4"/><circle cx="899" cy="896" r="6"/>
    </g>
    <rect x="12" y="12" width="1176" height="976" rx="18" fill="transparent" filter="url(#fiber)" opacity=".66"/>
    <rect x="26" y="26" width="1148" height="948" rx="15" fill="none" stroke="#795328" stroke-opacity=".26" stroke-width="2"/>
    <rect x="36" y="36" width="1128" height="928" rx="13" fill="none" stroke="#fff1ca" stroke-opacity=".16"/>
  </g>
</svg>