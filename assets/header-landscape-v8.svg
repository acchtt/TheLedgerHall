<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 340" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7efd0"/>
      <stop offset=".42" stop-color="#e7d6a7"/>
      <stop offset="1" stop-color="#b99a63"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff8cf" stop-opacity=".96"/>
      <stop offset=".42" stop-color="#f4dc91" stop-opacity=".5"/>
      <stop offset="1" stop-color="#e9c871" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mountains" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#9f9a77"/>
      <stop offset="1" stop-color="#6e6b51"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#9b955b"/>
      <stop offset="1" stop-color="#686a3f"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#71804c"/>
      <stop offset="1" stop-color="#39472b"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d8dec2"/>
      <stop offset=".45" stop-color="#aebba0"/>
      <stop offset="1" stop-color="#708b78"/>
    </linearGradient>
    <filter id="paint" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .055" numOctaves="3" seed="14" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="wobble"/>
      <feBlend in="wobble" in2="noise" mode="soft-light"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="8" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g"><feFuncA type="table" tableValues="0 .12"/></feComponentTransfer>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>
