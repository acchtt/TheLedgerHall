<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="none">
  <defs>
    <radialGradient id="paper" cx="48%" cy="39%" r="84%">
      <stop offset="0" stop-color="#f2e4c4"/>
      <stop offset=".58" stop-color="#e8d3a5"/>
      <stop offset=".86" stop-color="#d6b77f"/>
      <stop offset="1" stop-color="#aa7a3f"/>
    </radialGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff9e5" stop-opacity=".28"/>
      <stop offset=".36" stop-color="#fff4d6" stop-opacity=".05"/>
      <stop offset=".76" stop-color="#815025" stop-opacity=".035"/>
      <stop offset="1" stop-color="#5d3519" stop-opacity=".14"/>
    </linearGradient>
    <filter id="edge" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".013 .022" numOctaves="3" seed="46" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="fiber" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".72 .045" numOctaves="3" seed="18" result="fibers"/>
      <feColorMatrix in="fibers" type="matrix" values=".15 0 0 0 .55  0 .10 0 0 .40  0 0 .06 0 .23  0 0 0 .11 0" result="tint"/>
      <feBlend in="SourceGraphic" in2="tint" mode="multiply"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <g filter="url(#edge)">
    <rect x="13" y="13" width="1174" height="974" rx="9" fill="url(#paper)"/>
    <rect x="13" y="13" width="1174" height="974" rx="9" fill="url(#wash)"/>
    <g opacity=".065" filter="url(#soft)" fill="#714621">
      <ellipse cx="102" cy="125" rx="72" ry="51"/>
      <ellipse cx="1080" cy="174" rx="60" ry="43"/>
      <ellipse cx="212" cy="880" rx="80" ry="51"/>
      <ellipse cx="1025" cy="844" rx="88" ry="58"/>
    </g>
    <g opacity=".055" fill="#67401e">
      <circle cx="152" cy="107" r="5"/><circle cx="207" cy="162" r="3.5"/><circle cx="958" cy="122" r="4"/>
      <circle cx="1100" cy="718" r="4"/><circle cx="132" cy="770" r="3.5"/><circle cx="897" cy="910" r="5"/>
    </g>
    <rect x="13" y="13" width="1174" height="974" rx="9" fill="transparent" filter="url(#fiber)" opacity=".52"/>
    <rect x="27" y="27" width="1146" height="946" rx="7" fill="none" stroke="#765128" stroke-opacity=".29" stroke-width="2"/>
    <rect x="35" y="35" width="1130" height="930" rx="6" fill="none" stroke="#fff2d0" stroke-opacity=".17"/>
  </g>
</svg>